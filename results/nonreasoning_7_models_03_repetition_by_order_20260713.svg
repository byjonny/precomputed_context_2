<text x="40.0" y="84.0" fill="#aeb5bd" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1.000">Paired accuracy changes from x1 to x2; the two exceptions are visible rather than averaged away.</text>
